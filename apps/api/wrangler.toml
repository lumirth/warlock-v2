name = "uiuc-course-search"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CURRENT_YEAR = "2026"
CURRENT_TERM = "fall"

# API endpoints
CISAPI_BASE = "https://courses.illinois.edu/cisapp/explorer"
FEEDBACK_ALLOWED_ORIGINS = "https://uiuc-course-search-web.pages.dev"

# Sync settings
SYNC_CONCURRENCY = "25"
SYNC_EMBEDDINGS = "true"

# Rate limiting
BACKOFF_BASE_MS = "5000"
BACKOFF_MAX_MS = "60000"
MAX_RETRIES = "3"

# Caching
CLIENT_CACHE_TTL_MS = "30000"

[triggers]
crons = [
  "0 10,22 * * *",
  "30 10,22 * * *",
  "0 8 * * SUN",
  "*/5 * * * *"
]

[[d1_databases]]
binding = "DB"
database_name = "course-search-db-v2"
database_id = "c44924e5-5ac1-40b9-bf1e-7667083d9126"

[[kv_namespaces]]
binding = "GPA_CACHE"
id = "d7e1138ab1344bd2b102ed3502eb0b9f"
preview_id = "d6493db5a2db45ca8568c9d220a8e2b6"

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "d7e1138ab1344bd2b102ed3502eb0b9f"
preview_id = "d6493db5a2db45ca8568c9d220a8e2b6"

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "26060101"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "COURSE_RATE_LIMITER"
namespace_id = "26060102"

  [ratelimits.simple]
  limit = 240
  period = 60

[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "26060103"

  [ratelimits.simple]
  limit = 20
  period = 60

[[vectorize]]
binding = "VECTORIZE"
index_name = "course-embeddings"

[ai]
binding = "AI"

[[services]]
binding = "SELF"
service = "uiuc-course-search"

[env.staging]
name = "uiuc-course-search-staging"
workers_dev = true
preview_urls = false

[env.staging.triggers]
crons = []

[env.staging.vars]
CURRENT_YEAR = "2026"
CURRENT_TERM = "fall"
CISAPI_BASE = "https://courses.illinois.edu/cisapp/explorer"
FEEDBACK_ALLOWED_ORIGINS = "https://staging.uiuc-course-search-web.pages.dev"
SYNC_CONCURRENCY = "25"
SYNC_EMBEDDINGS = "true"
BACKOFF_BASE_MS = "5000"
BACKOFF_MAX_MS = "60000"
MAX_RETRIES = "3"
CLIENT_CACHE_TTL_MS = "30000"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "course-search-db-staging"
database_id = "76913703-61a0-4b9e-b703-a697135beaf1"

[[env.staging.kv_namespaces]]
binding = "GPA_CACHE"
id = "ad02afba85fb40aa9c7d2abceb15d896"

[[env.staging.kv_namespaces]]
binding = "SEARCH_CACHE"
id = "ad02afba85fb40aa9c7d2abceb15d896"

[[env.staging.ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "26060111"

  [env.staging.ratelimits.simple]
  limit = 120
  period = 60

[[env.staging.ratelimits]]
name = "COURSE_RATE_LIMITER"
namespace_id = "26060112"

  [env.staging.ratelimits.simple]
  limit = 240
  period = 60

[[env.staging.ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "26060113"

  [env.staging.ratelimits.simple]
  limit = 20
  period = 60

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "course-embeddings-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.services]]
binding = "SELF"
service = "uiuc-course-search-staging"
