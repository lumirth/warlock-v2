name = "uiuc-course-search"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CURRENT_YEAR = "2026"
CURRENT_TERM = "spring"

# API endpoints
CISAPI_BASE = "https://courses.illinois.edu/cisapp/explorer"
FRONTEND_BASE = "https://courses.illinois.edu"

# Sync settings
SYNC_INTERVAL_MS = "180000"
SYNC_CONCURRENCY = "25"
TERM_CHECK_INTERVAL_MS = "86400000"

# Rate limiting
BACKOFF_BASE_MS = "5000"
BACKOFF_MAX_MS = "60000"
MAX_RETRIES = "3"

# Caching
CLIENT_CACHE_TTL_MS = "30000"

[triggers]
crons = [
  "0 10,22 * * *",
  "0 8 * * SUN",
  "*/5 * * * *"
]

[[d1_databases]]
binding = "DB"
database_name = "course-search-db"
database_id = "ae2bcf8a-c988-4e93-81a7-0c96c089e5d6"

[[vectorize]]
binding = "VECTORIZE"
index_name = "course-embeddings"

[ai]
binding = "AI"

[[services]]
binding = "SELF"
service = "uiuc-course-search"
