name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify schema bootstrap
        run: npm run db:verify

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Enforce bundle budget
        run: npm run bundle:budget

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run security:secrets

      - name: Dependency audit
        run: npm run security:audit

      - name: Search smoke eval
        run: npm run eval:smoke

      - name: Upload eval smoke report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: eval-smoke-report
          path: artifacts/eval-smoke-*
          if-no-files-found: error
